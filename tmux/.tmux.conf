### configure Tmux Plugin Manager
set-environment -gF TMUX_PLUGIN_MANAGER_PATH '#{HOME}/.tmux/plugins'

# Bind C-s as prefix
set -g prefix C-s

# Bind prefix + r to reload the config
unbind r
bind r source-file ~/.tmux.conf

# Setting the start of the window and session index to 1
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Options to make tmux more pleasant
set -g mouse on
set -g default-terminal "tmux-256color"

# Source the plugin
run '#{TMUX_PLUGIN_MANAGER_PATH}/tmux/catppuccin.tmux'

# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"

# Load custom moudules
source -F '#{TMUX_PLUGIN_MANAGER_PATH}/custom_modules/ctp_memory.conf'
source -F '#{TMUX_PLUGIN_MANAGER_PATH}/custom_modules/primary_ip.conf'

# Configure Window
set -g @catppuccin_window_number_position 'right'
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_number "#I"
set -g @catppuccin_window_current_text '#W'
set -g @catppuccin_window_current_color '#{E:@thm_surface_2}'
set -g @catppuccin_window_current_number "#I"

# Configure Status Bar
set -g allow-rename off
set -g status-position top
set -g status-interval 5
set -g status-right-length 100
set -g status-left-length 100
set -g status-left '#{E:@catppuccin_status_session} '
set -gF status-right '#{E:@catppuccin_status_primary_ip}'
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right '#{E:@catppuccin_status_ctp_memory}'
set -agF status-right "#{E:@catppuccin_status_battery}"
set -ag status-right '#{E:@catppuccin_status_date_time}'
set -g @catppuccin_date_time_text ' %d/%m/%y %H:%M'
set -g @catppuccin_status_module_text_bg '#{E:@thm_mantle}'

# List of plugins
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'dreknix/tmux-primary-ip'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'thepante/tmux-git-autofetch'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-cowboy'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-yank'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '#{TMUX_PLUGIN_MANAGER_PATH}/tpm/tpm'
